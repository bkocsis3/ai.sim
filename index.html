<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI.Sim</title>
  <style>
    body {
      margin: 0;
      background: #111;
      color: #eee;
      font-family: sans-serif;

      display: flex;
      flex-direction: column;
      align-items: center;      
      justify-content: center;  
      height: 100vh;
    }
    #game-container {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative; /* needed for HUD overlay */
    }
    #ui {
      padding: 8px;
      background: #222;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    input, button, select {
      background: #333;
      color: #eee;
      border: 1px solid #555;
      padding: 4px 8px;
    }
    #ad-slot {
      width: 100%;
      height: 60px;
      background: #000;
      color: #888;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }
    #playerStats {
      position: absolute;
      top: 10px;
      right: 10px;
      background:#222;
      padding:10px 14px;
      font-size:14px;
      line-height:1.4;
      border:1px solid #444;
      border-radius:6px;
      z-index: 1000;
    }
    #gameStats {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background:#222;
      padding:10px 14px;
      font-size:14px;
      line-height:1.4;
      border:1px solid #444;
      border-radius:6px;
      z-index: 1000;
    }
  </style>
  <!-- Phaser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.js"></script>
</head>
<body>
  <div id="game-container"></div>

  <div id="playerStats">
    <strong>Agent</strong><br>
    Name: <span id="psName">-</span><br>
    Age: <span id="psAge">-</span><br>
    Health: <span id="psHealth">-</span><br><br>

    x Pos.: <span id="psX">-</span><br>
    y Pos.: <span id="psY">-</span><br><br>

    Level: <span id="psLevel">-</span><br>
    XP: <span id="psXP">-</span><br>
    Next Lvl XP: <span id="psNextLvlXP">-</span><br>
    Total XP: <span id="psTotalXP">-</span><br><br>

    Attack: <span id="psAttack">-</span><br>
    Charm: <span id="psCharm">-</span><br>
    Intelligence: <span id="psIntelligence">-</span><br>
    Max Health: <span id="psMaxHealth">-</span><br>
    Speed: <span id="psSpeed">-</span><br><br>
    
    Food: <span id="psFood">-</span><br>
    Kills: <span id="psKills">-</span><br>
  </div>

  <div id="gameStats">
    <strong>Game Performance</strong><br>
    Planned TPS: <span id="psPlannedTPS">-</span><br>
    Actual TPS: <span id="psActualTPS">-</span><br>
    TPS Efficiency: <span id="psTPSEff">-</span>
  </div>

  <div id="ui">
    <span>World size:</span>
    <select id="worldSize">
      <option value="10">10x10</option>
      <option value="20">20x20</option>
      <option value="30">30x30</option>
    </select>
    <span>Starting agents:</span>
    <select id="startAgents">
      <option value="1">1</option>
      <option value="5">5</option>
      <option value="10">10</option>
      <option value="20">20</option>
    </select>
    <button id="resetWorld">Reset World</button>
    <button id="spawnAgent">Spawn Agent</button>
    <button id="spawnResource">Spawn Resource</button>
    <button id="spawnObstacle">Spawn Obstacle</button>
    <button id="pauseGame">Pause</button>
    <button id="resumeGame">Resume</button>
  </div>

  <div id="ad-slot">
    <!-- Replace this with real ad code (AdSense / AdInPlay) -->
    Ad placeholder (banner)
  </div>

  <script src="agent.js"></script>
  <script src="world.js"></script>
  <script src="main.js"></script>
  <script src="resource.js"></script>
</body>
</html>
